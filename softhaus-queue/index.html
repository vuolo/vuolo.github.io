<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>softhaus</title>
  <style>
    :root {
      --bg: #000;
      --text: #e7e9ea;
      --muted: #71767a;
      --line: #2f3336;
      --chip: #181818;
      --btn: #eff3f4;
      --btn-text: #0f1419;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      color-scheme: dark;
    }
    body.locked { overflow: hidden; }
    .wrap {
      width: min(28rem, 100%);
      margin: 0 auto;
      padding: calc(1.15rem + env(safe-area-inset-top)) 1rem calc(2.25rem + env(safe-area-inset-bottom));
    }
    .card {
      background: #000;
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.9rem 0.95rem 1rem;
      cursor: pointer;
    }
    .tweet {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      column-gap: 0.75rem;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #333;
    }
    .who {
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
      min-width: 0;
      line-height: 1.25;
    }
    .name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .handle {
      color: var(--muted);
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caption {
      margin: 0.15rem 0 0.75rem;
      font-size: 15px;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .media {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #000;
    }
    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #16181c;
      cursor: pointer;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-top: 1.35rem;
    }
    button, .btn {
      appearance: none;
      border: 0;
      width: 100%;
      min-height: 3.5rem;
      border-radius: 999px;
      font: 700 1.05rem/1 var(--sans);
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .ghost {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .primary {
      background: var(--btn);
      color: var(--btn-text);
    }
    button:active, .btn:active { transform: scale(0.985); }
    #downloads {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-top: 0.15rem;
    }
    #downloads.show { display: grid; }
    #downloads a {
      display: block;
      border-radius: 0.7rem;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    #downloads img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1.2rem + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(140%);
      background: var(--btn);
      color: var(--btn-text);
      padding: 0.6rem 1rem;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .detail {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 20;
      display: none;
      flex-direction: column;
      overflow: auto;
    }
    body.show-detail .detail { display: flex; }
    .detail-bar {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      min-height: 53px;
      padding: calc(0.35rem + env(safe-area-inset-top)) 0.35rem 0.35rem 0.2rem;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      z-index: 1;
    }
    .icon-btn {
      width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font: 400 1.45rem/1 var(--sans);
    }
    .icon-btn:active { transform: none; background: #181818; }
    .detail-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .detail-body {
      width: min(28rem, 100%);
      margin: 0 auto;
      padding: 0.85rem 1rem 2rem;
    }
    .detail-who {
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }
    .detail-names { display: flex; flex-direction: column; line-height: 1.2; }
    .detail-names .name { font-size: 15px; }
    .detail-names .handle { font-size: 15px; }
    .detail .caption {
      margin: 0.85rem 0 0.9rem;
      font-size: 17px;
      line-height: 1.4;
    }
    .stamp {
      margin: 0.85rem 0 0;
      padding: 0.7rem 0;
      color: var(--muted);
      font-size: 15px;
      border-bottom: 1px solid var(--line);
    }
    .eng {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.4rem 0.2rem;
      color: var(--muted);
    }
    .eng span {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .eng svg { width: 20px; height: 20px; display: block; }

    .viewer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 30;
      display: none;
      touch-action: none;
    }
    body.show-viewer .viewer { display: block; }
    body.show-viewer { overflow: hidden; }
    .viewer-close {
      position: absolute;
      top: calc(0.35rem + env(safe-area-inset-top));
      left: 0.2rem;
      z-index: 2;
      width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font: 400 1.5rem/1 var(--sans);
    }
    .viewer-close:active { transform: none; background: rgba(255,255,255,0.1); }
    .viewer-count {
      position: absolute;
      top: calc(0.7rem + env(safe-area-inset-top));
      right: 0.9rem;
      z-index: 2;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .viewer-track {
      height: 100%;
      display: flex;
      transition: transform 0.28s ease;
      will-change: transform;
    }
    .viewer-track.dragging { transition: none; }
    .viewer-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .viewer-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(1.1rem + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 2;
    }
    .viewer-dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      display: block;
    }
    .viewer-dots i.on { background: #fff; }
  </style>
</head>

    const DEFAULT_IMAGES = ["01.jpg", "02.jpg", "03.jpg", "04.jpg"];
    let imageUrls = DEFAULT_IMAGES.slice();
    let mediaIndex = 0;
    const captionEl = document.getElementById("caption");
    const captionDetail = document.getElementById("caption-detail");
    const toast = document.getElementById("toast");
    const downloads = document.getElementById("downloads");
    const stampEl = document.getElementById("stamp");
    const viewer = document.getElementById("viewer");
    const track = document.getElementById("viewer-track");
    const countEl = document.getElementById("viewer-count");
    const dots = [...document.querySelectorAll("#viewer-dots i")];

    const currentCaption = () => (captionEl.textContent || "").trim();

    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    };

    const withVersion = (url, version) => {
      if (!version || String(url).includes("?")) return url;
      return `${url}?v=${encodeURIComponent(version)}`;
    };

    const applyImages = (urls) => {
      imageUrls = urls;

        if (url) img.src = url;
      });
      document.querySelectorAll("#viewer-track img").forEach((img, i) => {
        if (urls[i]) img.src = urls[i];
      });
      document.querySelectorAll("#downloads a").forEach((a, i) => {
        if (!urls[i]) return;
        a.href = urls[i];
        const img = a.querySelector("img");
        if (img) img.src = urls[i];
      });
    };

    const setCaption = (text) => {
      const trimmed = String(text || "").trim();
      if (!trimmed) return;
      captionEl.textContent = trimmed;
      captionDetail.textContent = trimmed;
    };

    const setStamp = (dateStr) => {
      if (!dateStr) return;
      const d = new Date(`${dateStr}T12:00:00`);
      if (isNaN(d)) return;
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      stampEl.textContent = `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    };

    const loadToday = async () => {
      let text = "";
      let version = "";
      try {
        const res = await fetch("today.json", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          text = String(data.caption || "").trim();
          version = String(data.version || data.v || "").trim();
          setStamp(data.date);
          if (Array.isArray(data.images) && data.images.length) {
            applyImages(data.images.map((url) => withVersion(url, version)));
          } else if (version) {
            applyImages(DEFAULT_IMAGES.map((name) => withVersion(name, version)));
          }
        }
      } catch (err) {}
      if (!text) {
        try {
          const res = await fetch("caption.txt", { cache: "no-store" });
          if (res.ok) text = (await res.text()).trim();
        } catch (err) {}
      }
      setCaption(text);
    };

    const parseHash = () => {
      const hash = location.hash || "";
      const media = hash.match(/^#media\/(\d+)/);
      if (media) {
        const n = Math.min(4, Math.max(1, parseInt(media[1], 10)));
        return { view: "media", index: n - 1 };
      }
      if (hash === "#post") return { view: "post" };
      return { view: "queue" };
    };

    const paintMedia = (index, dx = 0, dragging = false) => {
      mediaIndex = Math.max(0, Math.min(3, index));
      track.classList.toggle("dragging", dragging);
      const width = viewer.clientWidth || window.innerWidth;
      track.style.transform = `translateX(${-mediaIndex * width + dx}px)`;
      countEl.textContent = `${mediaIndex + 1} / 4`;
      dots.forEach((dot, i) => dot.classList.toggle("on", i === mediaIndex));
    };

    const render = () => {
      const route = parseHash();
      document.body.classList.toggle("show-detail", route.view === "post");
      document.body.classList.toggle("show-viewer", route.view === "media");
      document.body.classList.toggle("locked", route.view !== "queue");
      if (route.view === "media") paintMedia(route.index);
    };

    const go = (hash) => {
      const next = hash || location.pathname + location.search;
      if ((hash || "") === (location.hash || "")) {
        render();
        return;
      }
      history.pushState({ view: hash || "queue" }, "", next);
      render();
    };

    const back = () => {
      if (history.state && history.state.view) {
        history.back();
        return;
      }
      const route = parseHash();
      if (route.view === "media") {
        history.pushState({ view: "queue" }, "", location.pathname + location.search);
        history.replaceState({ view: "queue" }, "", location.pathname + location.search);
        render();
        return;
      }
      if (route.view === "post") {
        history.replaceState({ view: "queue" }, "", location.pathname + location.search);
        render();
        return;
      }
      render();
    };

    document.getElementById("card").addEventListener("click", (e) => {
      if (e.target.closest("img") && e.target.closest(".media")) return;
      go("#post");
    });

    document.getElementById("detail-back").addEventListener("click", (e) => {
      e.preventDefault();
      back();
    });

    document.getElementById("viewer-close").addEventListener("click", (e) => {
      e.preventDefault();
      back();
    });

    const onMediaTap = (e) => {
      const img = e.target.closest("img[data-i]");
      if (!img) return;
      e.preventDefault();
      e.stopPropagation();
      go(`#media/${Number(img.dataset.i) + 1}`);
    };
    document.getElementById("images").addEventListener("click", onMediaTap);
    document.getElementById("images-detail").addEventListener("click", onMediaTap);

    document.getElementById("copy").addEventListener("click", async () => {
      const caption = currentCaption();
      try {
        await navigator.clipboard.writeText(caption);
        showToast("Copied");
      } catch (err) {
        showToast("Long-press the caption");
      }
    });

    document.getElementById("save").addEventListener("click", async () => {
      try {
        const files = await Promise.all(imageUrls.map(async (name, i) => {
          const res = await fetch(name);
          const filename = DEFAULT_IMAGES[i] || `0${i + 1}.jpg`;
          const blob = await res.blob();
          return new File([blob], filename, { type: "image/jpeg" });
        }));
        if (navigator.canShare && navigator.canShare({ files })) {
          await navigator.share({ files });
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      for (const [i, url] of imageUrls.entries()) {
        const a = document.createElement("a");
        a.href = url;
        a.download = DEFAULT_IMAGES[i] || `0${i + 1}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
      downloads.classList.add("show");
    });

    let startX = 0, startY = 0, lastX = 0, lastY = 0, axis = null, swiping = false;
    const startAt = (x, y) => {
      startX = lastX = x;
      startY = lastY = y;
      axis = null;
      swiping = true;
      viewer.style.transition = "none";
      track.classList.add("dragging");
    };
    const moveAt = (x, y, ev) => {
      if (!swiping) return;
      lastX = x;
      lastY = y;
      const dx = x - startX;
      const dy = y - startY;
      if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      }
      if (axis === "x") {
        if (ev) ev.preventDefault();
        const atStart = mediaIndex === 0 && dx > 0;
        const atEnd = mediaIndex === 3 && dx < 0;
        const resist = (atStart || atEnd) ? 0.35 : 1;
        paintMedia(mediaIndex, dx * resist, true);
      } else if (axis === "y" && dy > 0) {
        if (ev) ev.preventDefault();
        const p = Math.min(1, dy / 320);
        viewer.style.transform = `translateY(${dy}px)`;
        viewer.style.opacity = String(1 - p * 0.5);
      }
    };
    const endAt = () => {
      if (!swiping) return;
      swiping = false;
      track.classList.remove("dragging");
      const dx = lastX - startX;
      const dy = lastY - startY;
      const width = viewer.clientWidth || window.innerWidth;
      viewer.style.transition = "";
      viewer.style.transform = "";
      viewer.style.opacity = "";
      if (axis === "x" && Math.abs(dx) > Math.min(64, width * 0.18)) {
        paintMedia(mediaIndex + (dx < 0 ? 1 : -1));
        history.replaceState({ view: "media" }, "", `#media/${mediaIndex + 1}`);
      } else if (axis === "y" && dy > 90) {
        back();
      } else if (!axis || (Math.abs(dx) < 8 && Math.abs(dy) < 8)) {
        back();
      } else {
        paintMedia(mediaIndex);
      }
    };

    viewer.addEventListener("touchstart", (e) => {
      if (e.target.closest(".viewer-close")) return;
      const t = e.changedTouches[0];
      startAt(t.clientX, t.clientY);
    }, { passive: true });
    viewer.addEventListener("touchmove", (e) => {
      const t = e.changedTouches[0];
      moveAt(t.clientX, t.clientY, e);
    }, { passive: false });
    viewer.addEventListener("touchend", endAt);
    viewer.addEventListener("touchcancel", endAt);

    viewer.addEventListener("mousedown", (e) => {
      if (e.target.closest(".viewer-close")) return;
      startAt(e.clientX, e.clientY);
    });
    window.addEventListener("mousemove", (e) => {
      if (!swiping) return;
      moveAt(e.clientX, e.clientY, e);
    });
    window.addEventListener("mouseup", endAt);

    window.addEventListener("keydown", (e) => {
      if (!document.body.classList.contains("show-viewer")) {
        if (e.key === "Escape" && document.body.classList.contains("show-detail")) back();
        return;
      }
      if (e.key === "Escape") back();
      if (e.key === "ArrowLeft") {
        paintMedia(mediaIndex - 1);
        history.replaceState({ view: "media" }, "", `#media/${mediaIndex + 1}`);
      }
      if (e.key === "ArrowRight") {
        paintMedia(mediaIndex + 1);
        history.replaceState({ view: "media" }, "", `#media/${mediaIndex + 1}`);
      }
    });

    window.addEventListener("popstate", render);
    window.addEventListener("resize", () => {
      if (document.body.classList.contains("show-viewer")) paintMedia(mediaIndex);
    });

    render();
    loadToday();
  </script>
</body>
</html>
