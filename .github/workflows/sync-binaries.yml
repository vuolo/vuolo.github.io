name: Sync binary assets
on:
  push:
    branches:
      - main
    paths:
      - "payloads/**"
      - ".github/workflows/sync-binaries.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads into fonts, assets, palette-queue, and x/
        run: |
          python3 - << 'PY'
          import base64, io, json, tarfile, pathlib, subprocess, sys
          root = pathlib.Path(".")
          payloads = sorted((root / "payloads").glob("*.tar.b64"))
          if not payloads:
              print("no payloads")
              sys.exit(0)
          allowed_prefix = ("fonts/", "assets/", "palette-queue/", "softhaus-queue/", "x/")
          written = []
          for payload in payloads:
              data = base64.b64decode("".join(payload.read_text().split()))
              with tarfile.open(fileobj=io.BytesIO(data), mode="r") as tar:
                  for member in tar.getmembers():
                      if not member.isfile():
                          continue
                      name = member.name.lstrip("./")
                      if not name.startswith(allowed_prefix) or ".." in name:
                          sys.exit(f"refusing path {name}")
                      dest = root / name
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(tar.extractfile(member).read())
                      written.append(name)
          # Old softhaus-queue payloads must not restore a working alias.
          # Leave only a redirecting index.html (maintained in the repo).
          sq = root / "softhaus-queue"
          removed = []
          if sq.is_dir():
              for p in sorted(sq.rglob("*")):
                  if p.is_file() and p.name != "index.html":
                      rel = str(p.relative_to(root))
                      p.unlink()
                      removed.append(rel)
          # Drop numbered stills under x/<handle>/ that the latest
          # images.txt or today.json no longer lists, so older payloads
          # cannot resurrect e.g. 03.jpg after a shorter set.
          pruned = []
          xroot = root / "x"
          if xroot.is_dir():
              for folder in sorted(p for p in xroot.iterdir() if p.is_dir()):
                  keep = set()
                  man = folder / "images.txt"
                  if man.is_file():
                      for line in man.read_text().splitlines():
                          line = line.strip()
                          if line:
                              keep.add(pathlib.Path(line.split("?")[0]).name)
                  todayp = folder / "today.json"
                  if todayp.is_file():
                      try:
                          data = json.loads(todayp.read_text())
                      except Exception:
                          data = {}
                      for url in data.get("images") or []:
                          keep.add(pathlib.Path(str(url).split("?")[0]).name)
                  if not keep:
                      continue
                  for p in sorted(folder.glob("*.jpg")):
                      if len(p.stem) >= 2 and p.stem[:2].isdigit() and p.name not in keep:
                          rel = str(p.relative_to(root))
                          p.unlink()
                          pruned.append(rel)
          if not written and not removed and not pruned:
              print("no files in payloads")
              sys.exit(0)
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          # Skip paths deleted by cleanup; `git add -A` on those dirs stages removals.
          unique = sorted(n for n in set(written) if (root / n).is_file())
          add_paths = list(unique)
          if removed:
              add_paths.append("softhaus-queue")
          for rel in pruned:
              parent = str(pathlib.Path(rel).parent)
              if parent not in add_paths:
                  add_paths.append(parent)
          subprocess.check_call(["git", "add", "-A", "--"] + add_paths)
          if subprocess.call(["git", "diff", "--cached", "--quiet"]) == 0:
              print("no changes")
              sys.exit(0)
          print("updated:", *unique, sep="\n  ")
          if removed:
              print("removed stale softhaus-queue files:", *removed, sep="\n  ")
          if pruned:
              print("removed leftover stills:", *pruned, sep="\n  ")
          subprocess.check_call(["git", "commit", "-m", "Decode binary fonts and images"])
          subprocess.check_call(["git", "push"])
          PY
